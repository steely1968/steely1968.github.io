<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">
    


    <title>Countdown Timer | Converts Days to hours | Percentage Time Passed/title>

<meta name="description" content="Countdown timer converts days to hours and seconds with percentage of time passed">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://homerepairs4u.com/countdown-timer.html">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 800px;
    text-align: center;
}

h1 {
    font-size: clamp(30px, 6vw, 55px);
    margin: 0 0 30px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 35px;
}

input {
    width: 180px;
    padding: 14px;
    font-size: 20px;
    text-align: center;
    border: none;
    border-radius: 8px;
}

button {
    padding: 14px 24px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.start {
    background: #28a745;
    color: white;
}

.reset {
    background: #dc3545;
    color: white;
}

.clock {
    font-size: clamp(38px, 10vw, 90px);
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.percentage {
    margin-top: 25px;
    font-size: clamp(24px, 5vw, 38px);
    font-weight: bold;
}

.progress {
    width: 100%;
    height: 28px;
    margin-top: 25px;
    background: #333;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #28a745;
}

.status {
    margin-top: 15px;
    color: #aaa;
    font-size: 16px;
}

@media (max-width: 600px) {

    .controls {
        flex-direction: column;
    }

    input,
    button {
        width: 100%;
        max-width: 300px;
    }

    .clock {
        font-size: clamp(30px, 9vw, 60px);
        white-space: normal;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Countdown Timer</h1>

    <div class="controls">

        <input
            id="days"
            type="number"
            min="0.001"
            step="0.001"
            placeholder="Enter days"
        >

        <button
            class="start"
            onclick="startTimer()">
            Start
        </button>

        <button
            class="reset"
            onclick="resetTimer()">
            Reset
        </button>

    </div>

    <div
        id="clock"
        class="clock">
        0h 00m 00.00s
    </div>

    <div
        id="percentage"
        class="percentage">
        0.00% passed
    </div>

    <div class="progress">
        <div
            id="progressBar"
            class="progress-bar">
        </div>
    </div>

    <div
        id="status"
        class="status">
        Enter days and press Start
    </div>

</div>


<script>

/* ==========================================
   TIMER STORAGE
========================================== */

const STORAGE_KEY = "myCountdownTimer";

let interval = null;


/* ==========================================
   START TIMER
========================================== */

function startTimer() {

    const days =
        parseFloat(
            document.getElementById("days").value
        );

    if (!days || days <= 0) {

        alert("Please enter the number of days.");

        return;
    }


    /* Convert days into milliseconds */

    const duration =
        days *
        24 *
        60 *
        60 *
        1000;


    const startTime =
        Date.now();


    const endTime =
        startTime + duration;


    const timer = {

        start: startTime,

        end: endTime,

        duration: duration

    };


    /* Save timer to this browser */

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(timer)
    );


    runTimer();
}


/* ==========================================
   RUN TIMER
========================================== */

function runTimer() {

    if (interval !== null) {

        clearInterval(interval);
    }


    updateTimer();


    /*
       50 milliseconds =
       1/20th of a second
    */

    interval =
        setInterval(
            updateTimer,
            50
        );
}


/* ==========================================
   UPDATE TIMER
========================================== */

function updateTimer() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return;
    }


    const timer =
        JSON.parse(saved);


    const now =
        Date.now();


    let remaining =
        timer.end - now;


    /* ======================================
       TIMER FINISHED
    ====================================== */

    if (remaining <= 0) {

        remaining = 0;


        document.getElementById(
            "clock"
        ).textContent =
            "0h 00m 00.00s";


        document.getElementById(
            "percentage"
        ).textContent =
            "100.00% passed";


        document.getElementById(
            "progressBar"
        ).style.width =
            "100%";


        document.getElementById(
            "status"
        ).textContent =
            "Countdown finished";


        clearInterval(interval);

        interval = null;

        return;
    }


    /* ======================================
       CALCULATE PERCENTAGE
    ====================================== */

    const elapsed =
        timer.duration - remaining;


    let percentage =
        (
            elapsed /
            timer.duration
        ) * 100;


    percentage =
        Math.max(
            0,
            Math.min(
                100,
                percentage
            )
        );


    /* ======================================
       CALCULATE HOURS
    ====================================== */

    const totalSeconds =
        remaining / 1000;


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (
                totalSeconds % 3600
            ) / 60
        );


    const seconds =
        Math.floor(
            totalSeconds % 60
        );


    /* ======================================
       CALCULATE 1/20 SECOND
    ====================================== */

    const fraction =
        Math.floor(
            (
                remaining % 1000
            ) / 50
        );


    const fractionText =
        String(
            fraction * 5
        ).padStart(
            2,
            "0"
        );


    /* ======================================
       DISPLAY COUNTDOWN
    ====================================== */

    document.getElementById(
        "clock"
    ).textContent =

        hours +
        "h " +

        String(minutes)
            .padStart(2, "0") +

        "m " +

        String(seconds)
            .padStart(2, "0") +

        "." +

        fractionText +

        "s";


    /* ======================================
       DISPLAY PERCENTAGE
    ====================================== */

    document.getElementById(
        "percentage"
    ).textContent =

        percentage.toFixed(4) +
        "% passed";


    /* ======================================
       PROGRESS BAR
    ====================================== */

    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    /* ======================================
       STATUS
    ====================================== */

    document.getElementById(
        "status"
    ).textContent =
        "Countdown running";
}


/* ==========================================
   RESET
========================================== */

function resetTimer() {

    if (interval !== null) {

        clearInterval(interval);

        interval = null;
    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    document.getElementById(
        "clock"
    ).textContent =
        "0h 00m 00.00s";


    document.getElementById(
        "percentage"
    ).textContent =
        "0.0000% passed";


    document.getElementById(
        "progressBar"
    ).style.width =
        "0%";


    document.getElementById(
        "status"
    ).textContent =
        "Timer reset";


    document.getElementById(
        "days"
    ).value = "";
}


/* ==========================================
   RESTORE TIMER WHEN PAGE OPENS
========================================== */

function loadTimer() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        runTimer();

    }
}


/* ==========================================
   PAGE LOADED
========================================== */

window.addEventListener(
    "load",
    loadTimer
);

</script>

</body>
</html>
