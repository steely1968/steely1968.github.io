<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">
    


    <title>Countdown Timer | Converts Days to hours | Percentage Time Passed/title>
<link rel="canonical" href="https://homerepairs4u.com/countdown-timer.html">
<style>
body {
margin: 0;
padding: 20px;
font-family: Arial, sans-serif;
text-align: center;
background: #ffffff;
color: #111111;
}

h1 {
margin-top: 20px;
}

input {
width: 180px;
padding: 12px;
font-size: 20px;
text-align: center;
}

button {
padding: 12px 20px;
margin: 5px;
font-size: 18px;
cursor: pointer;
}

#countdown {
margin-top: 40px;
font-size: 50px;
font-weight: bold;
}

#percentage {
margin-top: 20px;
font-size: 28px;
}

#bar {
width: 90%;
max-width: 800px;
height: 30px;
margin: 25px auto;
background: #dddddd;
}

#progress {
height: 100%;
width: 0%;
background: #22aa22;
}
</style>
</head>

<body>

<h1>Countdown Timer</h1>

<p>Enter number of days</p>

<input id="days" type="number" min="0.001" step="0.001">

<br><br>

<button id="startButton">START</button>
<button id="resetButton">RESET</button>

<div id="countdown">0h 00m 00.00s</div>

<div id="percentage">0.0000% passed</div>

<div id="bar">
<div id="progress"></div>
</div>

<script>

var timerID = null;

var STORAGE = "my_countdown_timer";


function saveTimer(start, end, duration) {

var data = {
start: start,
end: end,
duration: duration
};

localStorage.setItem(STORAGE, JSON.stringify(data));
}


function getTimer() {

var saved = localStorage.getItem(STORAGE);

if (!saved) {
return null;
}

try {
return JSON.parse(saved);
} catch (e) {
return null;
}
}


function startTimer() {

var days = parseFloat(
document.getElementById("days").value
);

if (!days || days <= 0) {
alert("Please enter the number of days.");
return;
}

var duration = days * 24 * 60 * 60 * 1000;

var start = Date.now();

var end = start + duration;

saveTimer(start, end, duration);

if (timerID !== null) {
clearInterval(timerID);
}

timerID = setInterval(updateTimer, 50);

updateTimer();
}


function updateTimer() {

var data = getTimer();

if (!data) {
return;
}

var now = Date.now();

var remaining = data.end - now;

if (remaining <= 0) {

document.getElementById("countdown").textContent =
"0h 00m 00.00s";

document.getElementById("percentage").textContent =
"100.0000% passed";

document.getElementById("progress").style.width =
"100%";

if (timerID !== null) {
clearInterval(timerID);
timerID = null;
}

return;
}


/* TOTAL HOURS */

var hours = Math.floor(
remaining / 3600000
);


/* MINUTES */

var minutes = Math.floor(
(remaining % 3600000) / 60000
);


/* SECONDS */

var seconds = Math.floor(
(remaining % 60000) / 1000
);


/*
1/20th second = 50 milliseconds

00
05
10
15
...
95
*/

var twentieth = Math.floor(
(remaining % 1000) / 50
);

var fraction = twentieth * 5;


if (minutes < 10) {
minutes = "0" + minutes;
}

if (seconds < 10) {
seconds = "0" + seconds;
}

if (fraction < 10) {
fraction = "0" + fraction;
}


document.getElementById("countdown").textContent =
hours + "h " +
minutes + "m " +
seconds + "." +
fraction + "s";


/* PERCENTAGE PASSED */

var passed = data.duration - remaining;

var percentage =
(passed / data.duration) * 100;


if (percentage < 0) {
percentage = 0;
}

if (percentage > 100) {
percentage = 100;
}


document.getElementById("percentage").textContent =
percentage.toFixed(4) + "% passed";


/* PROGRESS BAR */

document.getElementById("progress").style.width =
percentage + "%";
}


function resetTimer() {

if (timerID !== null) {
clearInterval(timerID);
timerID = null;
}

localStorage.removeItem(STORAGE);

document.getElementById("days").value = "";

document.getElementById("countdown").textContent =
"0h 00m 00.00s";

document.getElementById("percentage").textContent =
"0.0000% passed";

document.getElementById("progress").style.width =
"0%";
}


/* BUTTONS */

document.getElementById("startButton").onclick =
startTimer;

document.getElementById("resetButton").onclick =
resetTimer;


/* RESTORE SAVED TIMER */

window.addEventListener("load", function() {

var data = getTimer();

if (data) {

timerID = setInterval(
updateTimer,
50
);

updateTimer();
}
});

</script>

</body>
</html>
