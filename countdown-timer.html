<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">
    


    <title>Countdown Timer | Converts Days to hours | Percentage Time Passed/title>

<meta name="description" content="Countdown timer converts days to hours and seconds with percentage of time passed">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://homerepairs4u.com/countdown-timer.html">

<style>
body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 800px;
    margin: 50px auto;
}

h1 {
    font-size: 40px;
}

input {
    width: 150px;
    padding: 12px;
    font-size: 20px;
    text-align: center;
}

button {
    padding: 12px 20px;
    margin: 5px;
    font-size: 18px;
    cursor: pointer;
}

#start {
    background: green;
    color: white;
    border: 0;
}

#reset {
    background: red;
    color: white;
    border: 0;
}

#timer {
    margin-top: 40px;
    font-size: 70px;
    font-weight: bold;
}

#percent {
    margin-top: 20px;
    font-size: 30px;
}

.bar {
    width: 100%;
    height: 30px;
    background: #444;
    margin-top: 30px;
}

#progress {
    width: 0%;
    height: 100%;
    background: limegreen;
}

#status {
    margin-top: 20px;
    color: #aaa;
}

@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    #timer {
        font-size: 40px;
    }

    #percent {
        font-size: 24px;
    }

    input,
    button {
        width: 90%;
        margin: 5px auto;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>Countdown Timer</h1>

<input
    id="days"
    type="number"
    min="0.001"
    step="0.001"
    placeholder="Days"
>

<br>

<button id="start">
    START
</button>

<button id="reset">
    RESET
</button>

<div id="timer">
    0h 00m 00.00s
</div>

<div id="percent">
    0.0000% passed
</div>

<div class="bar">
    <div id="progress"></div>
</div>

<div id="status">
    Enter days and press START
</div>

</div>


<script>

var timer = null;


/* START BUTTON */

document.getElementById("start").onclick = function() {

    var days =
        parseFloat(
            document.getElementById("days").value
        );

    if (!days || days <= 0) {

        alert("Enter the number of days first.");

        return;
    }


    var duration =
        days *
        24 *
        60 *
        60 *
        1000;


    var data = {

        start: Date.now(),

        end:
            Date.now() +
            duration,

        duration: duration
    };


    localStorage.setItem(
        "countdownTimer",
        JSON.stringify(data)
    );


    update();
};


/* UPDATE TIMER */

function update() {

    var saved =
        localStorage.getItem(
            "countdownTimer"
        );


    if (!saved) {
        return;
    }


    var data =
        JSON.parse(saved);


    var now =
        Date.now();


    var remaining =
        data.end - now;


    if (remaining <= 0) {

        remaining = 0;

        document.getElementById("timer")
            .innerHTML =
            "0h 00m 00.00s";

        document.getElementById("percent")
            .innerHTML =
            "100.0000% passed";

        document.getElementById("progress")
            .style.width =
            "100%";

        document.getElementById("status")
            .innerHTML =
            "COUNTDOWN FINISHED";

        return;
    }


    /* TIME */

    var totalSeconds =
        remaining / 1000;


    var hours =
        Math.floor(
            totalSeconds / 3600
        );


    var minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    var seconds =
        Math.floor(
            totalSeconds % 60
        );


    /*
       1/20 second = 0.05 seconds
    */

    var twentieth =
        Math.floor(
            (remaining % 1000) / 50
        );


    var fraction =
        String(
            twentieth * 5
        ).padStart(2, "0");


    document.getElementById("timer")
        .innerHTML =

        hours +
        "h " +

        String(minutes)
            .padStart(2, "0") +

        "m " +

        String(seconds)
            .padStart(2, "0") +

        "." +

        fraction +

        "s";


    /* PERCENTAGE */

    var elapsed =
        data.duration - remaining;


    var percent =
        (
            elapsed /
            data.duration
        ) * 100;


    document.getElementById("percent")
        .innerHTML =

        percent.toFixed(4) +
        "% passed";


    /* PROGRESS BAR */

    document.getElementById("progress")
        .style.width =
        percent + "%";


    document.getElementById("status")
        .innerHTML =
        "COUNTDOWN RUNNING";
}


/* RESET BUTTON */

document.getElementById("reset").onclick = function() {

    localStorage.removeItem(
        "countdownTimer"
    );


    document.getElementById("timer")
        .innerHTML =
        "0h 00m 00.00s";


    document.getElementById("percent")
        .innerHTML =
        "0.0000% passed";


    document.getElementById("progress")
        .style.width =
        "0%";


    document.getElementById("status")
        .innerHTML =
        "Enter days and press START";
};


/*
   Update every 50 milliseconds.
   50ms = 1/20th second.
*/

setInterval(
    update,
    50
);


/*
   Restore timer when page opens.
*/

update();

</script>

</body>
</html>
