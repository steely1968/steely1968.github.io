function shuffleAndTrack(questionObj) {
    let originalAnswerText = questionObj.a[questionObj.c];
    let shuffledArray = [...questionObj.a];
    
    for (let i = shuffledArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledArray[i], shuffledArray[j]] = [shuffledArray[j], shuffledArray[i]];
    }
    
    questionObj.a = shuffledArray;
    questionObj.c = shuffledArray.indexOf(originalAnswerText);
    return questionObj;
}

let activeQuestions = [];

function generateUniqueExam() {
    activeQuestions = [];
    let attempts = 0;
    const maxAttempts = 300;
    
    while (activeQuestions.length < 30 && attempts < maxAttempts) {
        attempts++;
        let factory = templateFactories[Math.floor(Math.random() * templateFactories.length)];
        let baseQuestion = JSON.parse(JSON.stringify(factory()));
        let candidate = shuffleAndTrack(baseQuestion);
        
        if (templateFactories.length >= 30) {
            if (!activeQuestions.some(item => item.q === candidate.q)) {
                activeQuestions.push(candidate);
            }
        } else {
            activeQuestions.push(candidate);
        }
    }
    
    renderExamUI();
}

function renderExamUI() {
    const container = document.getElementById("quiz-container");
    container.innerHTML = "";
    
    document.getElementById("results").style.display = "none";
    document.getElementById("submit-btn").style.display = "block";
    document.getElementById("reset-btn").style.display = "none";
    document.getElementById("q-count").innerText = `0/30 Answered`;

    activeQuestions.forEach((qObj, qIdx) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `q-box-${qIdx}`;
        
        const qText = document.createElement("div");
        qText.className = "question-text";
        qText.innerText = `${qIdx + 1}. ${qObj.q}`;
        card.appendChild(qText);
        
        const optsList = document.createElement("ul");
        optsList.className = "options-list";
        
        qObj.a.forEach((optText, oIdx) => {
            const li = document.createElement("li");
            li.className = "option-item";
            
            const label = document.createElement("label");
            label.className = "option-label";
            label.id = `label-${qIdx}-${oIdx}`;
            
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `question-${qIdx}`;
            radio.value = oIdx;
            radio.required = true;
            
            radio.addEventListener("change", () => {
                const checkedCount = document.querySelectorAll('input[type="radio"]:checked').length;
                document.getElementById("q-count").innerText = `${checkedCount}/30 Answered`;
            });
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            li.appendChild(label);
            optsList.appendChild(li);
        });
        
        card.appendChild(optsList);
        container.appendChild(card);
    });
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById("quiz-form").addEventListener("submit", function(e) {
    e.preventDefault();
    let score = 0;
    
    activeQuestions.forEach((qObj, qIdx) => {
        const selected = document.querySelector(`input[name="question-${qIdx}"]:checked`);
        const chosenIdx = selected ? parseInt(selected.value) : -1;
        
        qObj.a.forEach((_, oIdx) => {
            const targetLabel = document.getElementById(`label-${qIdx}-${oIdx}`);
            if (oIdx === qObj.c) {
                targetLabel.classList.add("correct-answer");
            } else if (chosenIdx === oIdx) {
                targetLabel.classList.add("wrong-answer");
            }
        });
        
        if (chosenIdx === qObj.c) {
            score++;
        }
    });
    
    const percentage = Math.round((score / 30) * 100);
    const passRate = 80;
    const isPass = percentage >= passRate;
    const resultsBox = document.getElementById("results");
    resultsBox.style.display = "block";
    
    if (isPass) {
        resultsBox.className = "results-box pass";
        resultsBox.innerHTML = `<h2>Exam Passed! — ${percentage}%</h2><p>Excellent compliance execution. You correctly answered ${score} out of 30 mock questions.</p>`;
    } else {
        resultsBox.className = "results-box fail";
        resultsBox.innerHTML = `<h2>Exam Failed — ${percentage}%</h2><p>You scored ${score} out of 30. A minimum of 80% (24 correct answers) is required to pass the Level 2 Catering Framework.</p>`;
    }
    
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("reset-btn").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById("reset-btn").addEventListener("click", generateUniqueExam);
